[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "care-space-3d"
version = "0.1.0"
description = "Controlled synthetic-space reconstruction and passage research workbench"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.15.2", "trimesh==4.6.8", "Pillow==11.1.0", "rtree==1.4.0", "embreex==2.17.7.post6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
